name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: formium/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: formium

      - name: Type check
        run: npx tsc --noEmit
        working-directory: formium

      - name: Lint
        run: npm run lint
        working-directory: formium

      - name: Tests
        run: npm test
        working-directory: formium

      - name: Build
        run: npm run build
        working-directory: formium
        env:
          NEXT_PUBLIC_APP_URL: "https://formium.app"
